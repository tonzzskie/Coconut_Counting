<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-line {
            background: linear-gradient(to bottom, transparent, #a3f69c, transparent);
            height: 100px;
            width: 100%;
            position: absolute;
            top: -100px;
            left: 0;
            opacity: 0.5;
        }
        .camera-overlay-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.6) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-md overflow-hidden">
<!-- Main Full-Screen Container -->
<main class="relative h-screen w-full bg-black overflow-hidden">
<!-- Camera Viewport Emulator -->
<div class="absolute inset-0 z-0">
<img alt="Camera View" class="w-full h-full object-cover opacity-80" data-alt="First-person view of a tropical coconut grove with palm tree leaves framing the edges and ripe coconuts hanging above" src="https://lh3.googleusercontent.com/aida-public/AB6AXuARppRK_wKHRQO0ngWp1f06WJj0VfLcDc5EKLbYHHMa9tg0iGtYs2JUtP-wwl6el_ncTq4EKLblDFkhl7tBu_Cywl6j_bnF2N_Y1e9MpkSyX3xBaHzA4fHXP22MEYXC2dKsQTtX7Lp5mVpA0GhiOgRRXy_uY8L0WuiN0gTcTaQsssoYQfXqJn1opJY7J4LhlGMV_LxyYJPhIHu8NoEp37cK9zpLldg8kryc1_B_08vJNKG5tph1ZxlmFJhIUZtVErp8xJIykUOyjR8"/>
<!-- Bounding Boxes Overlay -->
<div class="absolute inset-0 pointer-events-none">
<!-- Bounding Box 1 -->
<div class="absolute border-2 border-secondary-fixed shadow-[0_0_8px_rgba(254,195,48,0.5)] rounded-lg" style="top: 25%; left: 35%; width: 120px; height: 120px;">
<div class="absolute -top-7 left-0 bg-secondary-container text-on-secondary-container text-label-sm font-label-sm px-2 py-0.5 rounded-t-lg flex items-center gap-1">
<span>Coconut</span>
<span class="font-bold">98%</span>
</div>
</div>
<!-- Bounding Box 2 -->
<div class="absolute border-2 border-secondary-fixed shadow-[0_0_8px_rgba(254,195,48,0.5)] rounded-lg" style="top: 15%; left: 60%; width: 90px; height: 90px;">
<div class="absolute -top-7 left-0 bg-secondary-container text-on-secondary-container text-label-sm font-label-sm px-2 py-0.5 rounded-t-lg flex items-center gap-1">
<span>Coconut</span>
<span class="font-bold">94%</span>
</div>
</div>
<!-- Bounding Box 3 (Partial/Blurry) -->
<div class="absolute border-2 border-secondary-fixed/50 rounded-lg" style="top: 45%; left: 10%; width: 100px; height: 100px;">
<div class="absolute -top-7 left-0 bg-secondary-container/70 text-on-secondary-container text-label-sm font-label-sm px-2 py-0.5 rounded-t-lg flex items-center gap-1">
<span>Coconut</span>
<span class="font-bold">72%</span>
</div>
</div>
</div>
<!-- UI Overlay Gradient -->
<div class="absolute inset-0 camera-overlay-gradient pointer-events-none"></div>
</div>
<!-- Top App Bar (Shared Component Style) -->
<header class="absolute top-0 left-0 w-full z-30 flex justify-between items-center px-4 h-16 pointer-events-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-white/20">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Close up portrait of a smiling agricultural professional in field gear with soft natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuByYhaYJOtB_QYwqa7JPxTfYW9Yc_0BnR8qdkcwRoqaHvO4FF681VbTCoSuDR6TnsssbcwR39TSdhdxqTCgfp6NuHOzRVDOf-6GCq6kSUjTuhdSl8j_qGcjerNNwKrctxFeDD0pvJEXBut4qBHfIpMkTsHjiErMnTv6mYOQbWr-MbK7v_QgfqL08YRa0PV6bqO-aBcUw5s3RY74ba1olLEjN20hyvjczPMFMRLkSGW1H5LykOir7qgGRbplLvNFKLSWigwN41gMvPA"/>
</div>
<h1 class="text-xl font-bold tracking-tight text-white font-headline-md">CocoScan</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-white hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
</header>
<!-- Detection Counter Display -->
<div class="absolute top-24 left-1/2 -translate-x-1/2 z-20 w-auto">
<div class="bg-primary-container/80 backdrop-blur-lg px-8 py-3 rounded-full flex flex-col items-center shadow-lg border border-primary/20">
<span class="text-white/80 font-label-sm text-label-sm uppercase tracking-widest">Coconuts Detected</span>
<span class="text-white font-headline-lg text-headline-lg leading-none mt-1">14</span>
</div>
</div>
<!-- Right Side AI Banner (Contextual Info) -->
<div class="absolute right-4 top-48 z-20 flex flex-col gap-2 max-w-[120px]">
<div class="bg-secondary-container/90 backdrop-blur-md p-3 rounded-xl shadow-sm border border-secondary/20">
<div class="flex items-center gap-1 mb-1">
<span class="material-symbols-outlined text-[16px] text-on-secondary-container" data-icon="light_mode">light_mode</span>
<span class="text-on-secondary-container text-label-sm font-label-sm">Light</span>
</div>
<div class="h-1 w-full bg-black/10 rounded-full overflow-hidden">
<div class="h-full bg-on-secondary-container w-4/5"></div>
</div>
</div>
<div class="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/10">
<div class="flex items-center gap-1 mb-1">
<span class="material-symbols-outlined text-[16px] text-white" data-icon="bolt">bolt</span>
<span class="text-white text-label-sm font-label-sm">AI Active</span>
</div>
<div class="flex gap-1">
<div class="h-1 flex-1 bg-primary-fixed rounded-full"></div>
<div class="h-1 flex-1 bg-primary-fixed rounded-full"></div>
<div class="h-1 flex-1 bg-primary-fixed rounded-full opacity-50"></div>
</div>
</div>
</div>
<!-- Camera Controls & Bottom Actions -->
<div class="absolute bottom-28 left-0 w-full z-30 px-6 flex justify-between items-center">
<!-- Start/Stop Toggle -->
<button class="bg-white/10 backdrop-blur-xl border border-white/20 p-4 rounded-2xl flex flex-col items-center gap-1 min-w-[80px] hover:bg-white/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-white" data-icon="stop_circle">stop_circle</span>
<span class="text-white text-label-sm font-label-sm">Stop</span>
</button>
<!-- Large Capture Button -->
<div class="relative">
<div class="absolute -inset-4 bg-primary-fixed/20 rounded-full blur-xl"></div>
<button class="relative bg-white p-1 rounded-full shadow-2xl active:scale-90 transition-transform">
<div class="border-4 border-primary w-20 h-20 rounded-full flex items-center justify-center">
<div class="bg-primary w-14 h-14 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl" data-icon="photo_camera" data-weight="fill" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
</button>
</div>
<!-- Flash Toggle -->
<button class="bg-white/10 backdrop-blur-xl border border-white/20 p-4 rounded-2xl flex flex-col items-center gap-1 min-w-[80px] hover:bg-white/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-white" data-icon="flash_on">flash_on</span>
<span class="text-white text-label-sm font-label-sm">Flash</span>
</button>
</div>
<!-- Bottom Navigation Bar (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-t-2xl border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_12px_rgba(46,125,50,0.08)]">
<a class="flex flex-col items-center justify-center bg-green-100 dark:bg-green-900/30 text-green-900 dark:text-green-100 rounded-2xl px-5 py-1 transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="visibility" data-weight="fill" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="font-['Work_Sans'] text-[12px] font-medium mt-1">Detect</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-5 py-1 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-['Work_Sans'] text-[12px] font-medium mt-1">History</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-5 py-1 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Work_Sans'] text-[12px] font-medium mt-1">Settings</span>
</a>
</nav>
<!-- Scanning Indicator Line -->
<div class="absolute inset-0 pointer-events-none z-10 overflow-hidden">
<div class="scanner-line" style="animation: scan 3s linear infinite;"></div>
</div>
</main>
<style>
        @keyframes scan {
            0% { top: -100px; }
            100% { top: 100vh; }
        }
        
        /* Material 3 Ripple-like active states */
        .active-ripple:active {
            background-color: rgba(0, 0, 0, 0.1);
            transform: scale(0.98);
        }

        /* Safe areas for mobile notched devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</body></html>
